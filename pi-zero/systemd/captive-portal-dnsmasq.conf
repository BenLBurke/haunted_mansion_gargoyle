# Installed to /etc/NetworkManager/dnsmasq-shared.d/captive-portal.conf
#
# Only takes effect while NetworkManager is running its "shared" (hotspot) mode
# on wlan0 -- i.e. only during WiFi setup -- and is inert the rest of the time.
# It answers every DNS query on the hotspot with the gargoyle's own address so
# phones/laptops auto-detect a captive portal and pop the setup page open.
address=/#/10.42.0.1
